openapi: 3.2.0
info:
  title: Public Agent Task API
  description: Public endpoints to interact with agents and orchestrate tasks
  version: '1.0'
  contact: {}
servers: []
tags:
- name: Agent Task
paths:
  /agent-tasks/{taskId}/updates:
    get:
      operationId: AgentTaskController_getSseUpdates
      summary: Get Task Updates (SSE)
      description: Subscribe to real-time updates for a specific task using Server-Sent Events (SSE). Returns a stream of task execution status changes and results.
      parameters:
      - name: taskId
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
      tags:
      - Agent Task
      security:
      - x-api-key: []
  /agent-tasks:
    post:
      operationId: AgentTaskController_createTaskSession
      summary: Create Agent Task
      description: Create a new task for an agent to execute. The task will be queued and processed according to the agent workflow.
      parameters:
      - name: current-workspace-id
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskSessionDto'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTaskWithUrlDto'
      tags:
      - Agent Task
      security:
      - bearer: []
      - x-api-key: []
    get:
      operationId: AgentTaskController_allTasks
      summary: List Agent Tasks
      description: Retrieve a paginated list of agent tasks with filtering and grouping options.
      parameters:
      - name: pageNum
        required: false
        in: query
        schema:
          minimum: 1
          default: 1
          type: number
      - name: pageSize
        required: false
        in: query
        schema:
          minimum: 1
          maximum: 100
          default: 10
          type: number
      - name: agentId
        required: false
        in: query
        schema:
          type: string
      - name: statuses
        required: false
        in: query
        schema:
          type: string
      - name: searchQuery
        required: false
        in: query
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        schema:
          type: string
      - name: startDate
        required: false
        in: query
        schema:
          type: string
      - name: endDate
        required: false
        in: query
        schema:
          type: string
      - name: grouping
        required: false
        in: query
        schema:
          enum:
          - status
          - agent
          type: string
      - name: isDraftTask
        required: false
        in: query
        description: If true, only draft tasks are returned. If false, only non-draft tasks are returned. If omitted, both are returned.
        schema:
          type: boolean
      - name: current-workspace-id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Tasks retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptimizedAllGraphTaskResponseDto'
      tags:
      - Agent Task
      security:
      - bearer: []
      - x-api-key: []
  /agent-tasks/analytics:
    get:
      operationId: AgentTaskController_agentAnalyticsDetail
      summary: Get Agent Analytics
      description: Retrieve analytics data for agent task execution including success rates, performance metrics, and usage statistics.
      parameters:
      - name: startDate
        required: true
        in: query
        schema:
          type: string
      - name: endDate
        required: true
        in: query
        schema:
          type: string
      - name: agentId
        required: true
        in: query
        schema:
          type: string
      - name: current-workspace-id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Analytics data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentAnalyticsResponseDto'
      tags:
      - Agent Task
      security:
      - bearer: []
      - x-api-key: []
  /agent-tasks/execution/{taskId}/user-input:
    patch:
      operationId: AgentTaskController_submitUserInput
      summary: Submit User Input
      description: Provide user input for a task that requires human interaction to continue execution.
      parameters:
      - name: taskId
        required: true
        in: path
        schema:
          type: string
      - name: current-workspace-id
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitTaskNodeExecutionUserInputDto'
      responses:
        '200':
          description: User input submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MinimalAgentTaskDto'
      tags:
      - Agent Task
      security:
      - bearer: []
      - x-api-key: []
  /agent-tasks/execution/{taskId}/rejection:
    post:
      operationId: AgentTaskController_submitUserRejection
      summary: Reject Task Execution
      description: Reject a task execution that requires user consent. The task will be marked as rejected and stop execution.
      parameters:
      - name: taskId
        required: true
        in: path
        schema:
          type: string
      - name: current-workspace-id
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskNodeUserConsentDto'
      responses:
        '201':
          description: Task rejection recorded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MinimalAgentTaskDto'
      tags:
      - Agent Task
      security:
      - bearer: []
      - x-api-key: []
  /agent-tasks/execution/{taskId}/user-consent:
    post:
      operationId: AgentTaskController_submitUserConsent
      summary: Approve Task Execution
      description: Provide user consent for a task to continue execution when approval is required.
      parameters:
      - name: taskId
        required: true
        in: path
        schema:
          type: string
      - name: current-workspace-id
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitTaskNodeUserConsentDto'
      responses:
        '201':
          description: User consent recorded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MinimalAgentTaskDto'
      tags:
      - Agent Task
      security:
      - bearer: []
      - x-api-key: []
  /agent-tasks/latest-executions:
    get:
      operationId: AgentTaskController_getLatestExecutions
      summary: Get Latest Task Executions
      description: Retrieve the most recent task executions for monitoring and debugging purposes.
      parameters:
      - name: agentId
        required: true
        in: query
        schema:
          type: string
      - name: pageNum
        required: false
        in: query
        schema:
          minimum: 1
          default: 1
          type: number
      - name: pageSize
        required: false
        in: query
        schema:
          minimum: 1
          maximum: 100
          default: 5
          type: number
      - name: includedStatuses
        required: false
        in: query
        schema:
          default: COMPLETED
          type: string
      - name: searchQuery
        required: false
        in: query
        schema:
          type: string
      - name: current-workspace-id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Latest executions retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatestExecutionsResponseDTO'
      tags:
      - Agent Task
      security:
      - bearer: []
      - x-api-key: []
  /agent-tasks/iterate:
    get:
      operationId: AgentTaskController_getNextTask
      summary: Get Next Task
      description: Iterate through tasks based on filters. Useful for task queue processing and navigation.
      parameters:
      - name: agentId
        required: false
        in: query
        schema:
          type: string
      - name: taskId
        required: false
        in: query
        schema:
          type: string
      - name: statuses
        required: false
        in: query
        schema:
          type: string
      - name: searchQuery
        required: false
        in: query
        schema:
          type: string
      - name: createdAt
        required: false
        in: query
        schema:
          type: string
      - name: updatedAt
        required: false
        in: query
        schema:
          type: string
      - name: grouping
        required: false
        in: query
        schema:
          enum:
          - status
          - agent
          type: string
      - name: current-workspace-id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Next task retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NavigationResponseDto'
      tags:
      - Agent Task
      security:
      - bearer: []
      - x-api-key: []
  /agent-tasks/execution/{taskId}/output-rating:
    patch:
      operationId: AgentTaskController_submitOutputRating
      summary: Rate Task Output
      description: Submit a rating for task execution output to improve agent performance.
      parameters:
      - name: taskId
        required: true
        in: path
        schema:
          type: string
      - name: current-workspace-id
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitTaskRatingDto'
      responses:
        '200':
          description: Rating submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MinimalAgentTaskDto'
      tags:
      - Agent Task
      security:
      - bearer: []
      - x-api-key: []
  /agent-tasks/tool-output-schema/{graphNodeId}:
    get:
      operationId: AgentTaskController_getToolOutputParamsByGraphNode
      summary: Get Tool Output Schema
      description: Retrieve the expected output schema for a specific tool in the agent graph.
      parameters:
      - name: graphNodeId
        required: true
        in: path
        schema:
          type: string
      - name: current-workspace-id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Tool output schema retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentToolConfigurationOutputParams'
      tags:
      - Agent Task
      security:
      - bearer: []
      - x-api-key: []
  /agent-tasks/retry:
    post:
      operationId: AgentTaskController_retryTaskExecution
      summary: Retry Task Execution
      description: Retry a failed or incomplete task execution with optional modifications.
      parameters:
      - name: current-workspace-id
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskNodeExecutionRetryOptionsDto'
      responses:
        '201':
          description: Task retry initiated successfully
      tags:
      - Agent Task
      security:
      - bearer: []
      - x-api-key: []
  /agent-tasks/{taskId}:
    get:
      operationId: AgentTaskController_taskDetail
      summary: Get Task Details
      description: Retrieve detailed information about a specific task including execution status and results.
      parameters:
      - name: taskId
        required: true
        in: path
        schema:
          type: string
      - name: current-workspace-id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Task details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MinimalAgentTaskDto'
      tags:
      - Agent Task
      security:
      - bearer: []
      - x-api-key: []
components:
  schemas:
    TaskNodeFeedbackPerKeysDto:
      type: object
      properties:
        outputKey:
          type: string
        description:
          type: string
      required:
      - outputKey
      - description
    SampleAgentTaskContextFile:
      type: object
      properties: {}
    MinimalAgentGraphEdgeDto:
      type: object
      properties:
        id:
          type: string
        sourceAgentGraphNodeId:
          type: string
        targetAgentGraphNodeId:
          type: string
        condition:
          type: string
        isAttachmentDataPulledIn:
          type: boolean
        conditionGroups:
          type: array
          items:
            $ref: '#/components/schemas/AgentGraphEdgeConditionGroup'
      required:
      - id
      - sourceAgentGraphNodeId
      - targetAgentGraphNodeId
      - isAttachmentDataPulledIn
      - conditionGroups
    TaskStepUserInput:
      type: object
      properties:
        question:
          type: string
        answer:
          type: string
        parameter:
          type: string
        memoryAnswer:
          type: boolean
        foodForThought:
          type: array
          items:
            $ref: '#/components/schemas/FoodForThought'
      required:
      - question
      - answer
    LinkedOutputParamRuleDto:
      type: object
      properties:
        elementKey:
          type: string
          description: Element key for the rule.
        operator:
          enum:
          - equals
          - not_equals
          - greater_than
          - less_than
          - contains
          - does_not_contain
          - starts_with
          - ends_with
          - is_empty
          - is_not_empty
          type: string
          description: Comparison operator for the rule.
        comparisonValueType:
          enum:
          - static
          - output_param
          type: string
          description: Type of the comparison value.
        comparisonValue:
          type:
          - string
          - 'null'
          description: Value to compare against.
        nextRuleOperator:
          enum:
          - AND
          - OR
          type: string
          description: Logical operator linking to the next rule.
      required:
      - elementKey
      - operator
      - comparisonValueType
    FoodForThought:
      type: object
      properties:
        question:
          type: string
        answer:
          type: string
      required:
      - question
      - answer
    TaskCreditTransactionResponseDto:
      type: object
      properties:
        id:
          type: string
        transactionType:
          enum:
          - subscription_purchase
          - one_time_purchase
          - subscription_renewal
          - credit_usage
          - credit_reset
          - credit_suspension
          - refund
          type: string
        creditsAmount:
          type: number
        tokensUsed:
          type: number
        costAmount:
          type: number
        usageCategory:
          type: string
        agentGraphNodeId:
          type: string
        toolType:
          type: string
        modelName:
          type: string
      required:
      - id
      - transactionType
      - creditsAmount
    ParamRuleConditionConfig:
      type: object
      properties:
        conditionType:
          type: string
          enum:
          - llm_based
          - rule_based
    CustomToolOutput:
      type: object
      properties:
        position:
          type: number
        paramName:
          type: string
        paramDescription:
          type: string
        id:
          type: string
        agentToolConfigurationId:
          type: string
        dataType:
          type:
          - string
          - 'null'
          enum:
          - string
          - number
          - boolean
          - object
          - enum
        isArray:
          type: boolean
        typeOptions:
          type:
          - object
          - 'null'
          additionalProperties: true
        parentId:
          type: string
        paramPath:
          type: string
        outputExample:
          type: string
    LatestExecutionsResponseDTO:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/MinimalAgentTaskDto'
        sampleTasks:
          type: array
          items:
            $ref: '#/components/schemas/SampleAgentTask'
        totalCount:
          type: number
      required:
      - tasks
      - sampleTasks
      - totalCount
    AgentGraphEdge:
      type: object
      properties:
        sourceAgentGraphNodeId:
          type: string
        targetAgentGraphNodeId:
          type: string
        condition:
          type: string
        isAttachmentDataPulledIn:
          type: boolean
        conditionGroups:
          type: array
          items:
            $ref: '#/components/schemas/AgentGraphEdgeConditionGroup'
        id:
          type: string
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
      - sourceAgentGraphNodeId
      - targetAgentGraphNodeId
      - isAttachmentDataPulledIn
      - conditionGroups
      - id
      - createdAt
      - updatedAt
    SampleAgentTask:
      type: object
      properties:
        agentId:
          type: string
        customId:
          type: string
        taskObjective:
          type: string
        taskQuery:
          $ref: '#/components/schemas/SampleAgentTaskQuery'
        status:
          type: string
        contextFiles:
          type: array
          items:
            $ref: '#/components/schemas/SampleAgentTaskContextFile'
        id:
          type: string
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
      - agentId
      - customId
      - taskObjective
      - taskQuery
      - status
      - contextFiles
      - id
      - createdAt
      - updatedAt
    TaskQueryDto:
      type: object
      properties:
        query:
          type: string
          description: The task query string.
        additionalInfo:
          type: string
          description: Additional context or information for the task.
      required:
      - query
    OptimizedGraphTaskResponseDto:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/MinimalAgentTaskDto'
        groupName:
          type: string
        groupId:
          type: string
        groupCount:
          type: number
        groupIcon:
          type: string
      required:
      - tasks
    PeriodMetricsDto:
      type: object
      properties:
        totalTasks:
          type: number
        completedTasks:
          type: number
        failedTasks:
          type: number
        averageEvaluationScore:
          type: number
        averageRuntimeSeconds:
          type: number
        totalRuntimeSeconds:
          type: number
        positiveFeedbackCount:
          type: number
        consentRequiredCount:
          type: number
        negativeFeedbackCount:
          type: number
      required:
      - totalTasks
      - completedTasks
      - failedTasks
      - averageEvaluationScore
      - averageRuntimeSeconds
      - totalRuntimeSeconds
      - positiveFeedbackCount
      - consentRequiredCount
      - negativeFeedbackCount
    AgentTriggerConfigurationFiltersConditions:
      type: object
      properties:
        condition:
          enum:
          - is
          - is_not
          - contain
          - does_not_contain
          - any
          - all
          - less_than
          - GREATER_than
          - count
          - exist
          - does_not_exist
          type: string
        operator:
          enum:
          - AND
          - OR
          type: string
        property:
          type: string
        value:
          type: string
      required:
      - condition
      - operator
      - property
      - value
    IterateGraphResponseDto:
      type: object
      properties:
        agentId:
          type: string
      required:
      - agentId
    OptimizedAllGraphTaskResponseDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OptimizedGraphTaskResponseDto'
        totalCount:
          type: number
      required:
      - data
      - totalCount
    TaskNodeOutput:
      type: object
      properties:
        value:
          type: object
      required:
      - value
    TaskNodeTokenUsage:
      type: object
      properties:
        agentTaskId:
          type: string
        agentGraphNodeId:
          type:
          - string
          - 'null'
        creditTransactionId:
          type:
          - string
          - 'null'
        promptSlug:
          type:
          - string
          - 'null'
        executionStage:
          enum:
          - QUERY_REFORMULATION
          - NODE_SELECTION
          - NODE_GENERATION
          - TOOL_SELECTION
          - NODE_RETRIEVAL
          - PARAMETER_EXTRACTION
          - TOOL_EXECUTION
          - NODE_EVALUATION
          type: string
        iteration:
          type: number
        model:
          type: string
        operation:
          enum:
          - NORMAL
          - PROVIDER_ERROR
          - PARSER_ERROR
          - TIMEOUT
          - HIGH_TOKEN_FALLBACK
          - MODEL_FALLBACK
          - AUTO_FIX
          - RATE_LIMIT
          type: string
        inputToken:
          type: number
        outputToken:
          type: number
        reasoningToken:
          type:
          - number
          - 'null'
        totalToken:
          type: number
        isLatest:
          type: boolean
        agentTask:
          $ref: '#/components/schemas/AgentTask'
        id:
          type: string
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
      - agentTaskId
      - agentGraphNodeId
      - creditTransactionId
      - promptSlug
      - executionStage
      - iteration
      - model
      - operation
      - inputToken
      - outputToken
      - reasoningToken
      - totalToken
      - isLatest
      - agentTask
      - id
      - createdAt
      - updatedAt
    User:
      type: object
      properties:
        name:
          type: string
          description: Full name of the user.
          example: John Doe
        avatarSrc:
          type: string
          description: URL to the user profile avatar image.
          example: https://example.com/avatars/user123.png
        email:
          type: string
        cognitoUserId:
          type: string
        socialProvider:
          type: string
        socialProviderId:
          type: string
        password:
          type: string
        paymentProviderCustomerId:
          type: string
        rememberToken:
          type: string
        emailVerified:
          type: boolean
        referralCode:
          type: string
        role_name:
          type: string
        isInternalUser:
          type: boolean
        id:
          type: string
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
      - name
      - email
      - cognitoUserId
      - role_name
      - isInternalUser
      - id
      - createdAt
      - updatedAt
    NodeConfigurations:
      type: object
      properties:
        conditionType:
          enum:
          - llm_based
          - rule_based
          type: string
        llmModel:
          type: string
        fallbackModels:
          type: string
        waitType:
          enum:
          - time_based
          - condition_based
          type: string
        timeToWaitValue:
          type: number
        timeToWaitUnit:
          enum:
          - minutes
          - hours
          - days
          - months
          type: string
        linkedAgentGraphNodeId:
          type: string
        rule:
          type: string
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/AgentTriggerConfigurationFiltersGroup'
        timeoutType:
          enum:
          - no_timeout
          - set_timeout
          type: string
        timeoutValue:
          type: number
        timeoutUnit:
          enum:
          - minutes
          - hours
          - days
          - months
          type: string
        onTimeout:
          enum:
          - continue
          - fail
          type: string
    AgentGraphEdgeConditionRule:
      type: object
      properties:
        agentGraphEdgeConditionGroupId:
          type: string
        sourceAgentToolConfigurationOutputParamsId:
          type: string
        operator:
          enum:
          - equals
          - not_equals
          - greater_than
          - less_than
          - contains
          - does_not_contain
          - starts_with
          - ends_with
          - is_empty
          - is_not_empty
          type: string
        comparisonValueType:
          enum:
          - static
          - output_param
          type: string
        comparisonValue:
          type: string
        comparisonAgentToolConfigurationOutputParamsId:
          type: string
        nextRuleOperator:
          enum:
          - AND
          - OR
          type: string
        group:
          $ref: '#/components/schemas/AgentGraphEdgeConditionGroup'
        sourceOutputParam:
          $ref: '#/components/schemas/AgentToolConfigurationOutputParams'
        comparisonOutputParam:
          $ref: '#/components/schemas/AgentToolConfigurationOutputParams'
        id:
          type: string
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
      - agentGraphEdgeConditionGroupId
      - sourceAgentToolConfigurationOutputParamsId
      - operator
      - comparisonValueType
      - group
      - sourceOutputParam
      - id
      - createdAt
      - updatedAt
    MinimalAgentDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        themeIconUrl:
          type: string
        agentCategoryId:
          type: string
        category:
          $ref: '#/components/schemas/MinimalAgentCategoryDto'
        type:
