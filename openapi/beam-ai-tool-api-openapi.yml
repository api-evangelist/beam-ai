openapi: 3.2.0
info:
  title: Public Tool API
  description: Public endpoints to interact with agents and orchestrate tasks
  version: '1.0'
  contact: {}
servers: []
tags:
- name: Tool
paths:
  /tool/active-tools:
    get:
      operationId: ToolController_getActiveTools
      summary: Get Active Tools
      description: Retrieve all active tools for the current workspace.
      parameters:
      - name: type
        required: false
        in: query
        schema:
          enum:
          - beam_tool
          - gpt_tool
          - custom_gpt_tool
          - custom_integration_tool
          - code_executor_tool
          type: string
      - required: false
        name: pageNum
        in: query
        schema:
          minimum: 1
          type: number
      - required: false
        name: pageSize
        in: query
        schema:
          minimum: 1
          maximum: 100
          type: number
      - name: categoryId
        required: false
        in: query
        schema:
          type: string
      - name: agentId
        required: false
        in: query
        schema:
          type: string
      - name: creatorType
        required: false
        in: query
        schema:
          type: string
      - name: searchKeyword
        required: false
        in: query
        schema:
          type: string
      - name: excludedFunctionNames
        required: false
        in: query
        schema:
          type: string
      - name: includedFunctionNames
        required: false
        in: query
        schema:
          type: string
      - name: excludeAgentTools
        required: false
        in: query
        schema:
          type: boolean
      - name: current-workspace-id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Active tools retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllToolsViewDto'
      tags:
      - Tool
      security:
      - x-api-key: []
  /tool/optimize/{toolFunctionName}:
    post:
      operationId: ToolController_optimizeTool
      summary: Optimize Tool
      description: Optimize a tool's performance and configuration based on usage patterns and feedback.
      parameters:
      - name: toolFunctionName
        required: true
        in: path
        schema:
          type: string
      - name: current-workspace-id
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolOptimizeRequestDTO'
      responses:
        '201':
          description: Tool optimization initiated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolOptimizeResponseDTO'
      tags:
      - Tool
      security:
      - bearer: []
      - x-api-key: []
  /tool/optimization-status/thread/{threadId}:
    post:
      operationId: ToolController_getToolOptimizationStatus
      summary: Get Tool Optimization Status
      description: Check the status of an ongoing tool optimization process.
      parameters:
      - name: threadId
        required: true
        in: path
        schema:
          type: string
      - name: current-workspace-id
        in: header
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Optimization status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolOptimizeResponseDTO'
      tags:
      - Tool
      security:
      - bearer: []
      - x-api-key: []
components:
  schemas:
    LinkedOutputParamRuleDto:
      type: object
      properties:
        elementKey:
          type: string
          description: Element key for the rule.
        operator:
          enum:
          - equals
          - not_equals
          - greater_than
          - less_than
          - contains
          - does_not_contain
          - starts_with
          - ends_with
          - is_empty
          - is_not_empty
          type: string
          description: Comparison operator for the rule.
        comparisonValueType:
          enum:
          - static
          - output_param
          type: string
          description: Type of the comparison value.
        comparisonValue:
          type:
          - string
          - 'null'
          description: Value to compare against.
        nextRuleOperator:
          enum:
          - AND
          - OR
          type: string
          description: Logical operator linking to the next rule.
      required:
      - elementKey
      - operator
      - comparisonValueType
    ParamRuleConditionConfig:
      type: object
      properties:
        conditionType:
          type: string
          enum:
          - llm_based
          - rule_based
    CustomToolOutput:
      type: object
      properties:
        position:
          type: number
        paramName:
          type: string
        paramDescription:
          type: string
        id:
          type: string
        agentToolConfigurationId:
          type: string
        dataType:
          type:
          - string
          - 'null'
          enum:
          - string
          - number
          - boolean
          - object
          - enum
        isArray:
          type: boolean
        typeOptions:
          type:
          - object
          - 'null'
          additionalProperties: true
        parentId:
          type: string
        paramPath:
          type: string
        outputExample:
          type: string
    IntegrationsViewEntity:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the integration.
        name:
          type: string
          description: Name of the integration.
        description:
          type: string
          description: Description of the integration.
        systemIntegrationIdentifier:
          type: string
          description: System integration identifier.
        integrationCategoryId:
          type: string
          description: UUID of the integration category.
        iconSrc:
          type: string
          description: Icon source URL.
        type:
          enum:
          - integration
          - custom_integration
          type: string
          description: Type of integration.
        userId:
          type: string
          description: UUID of the user.
        workspaceId:
          type: string
          description: UUID of the workspace.
        privacyPolicyUrl:
          type: string
          description: Privacy policy URL.
        shortDescription:
          type: string
          description: Short description of the integration.
        longDescription:
          type: string
          description: Detailed description of the integration.
        systemIntegrationProvider:
          type: string
          description: System integration provider.
        customAuthParameters:
          type: object
          description: Custom authentication parameters.
        category:
          type: string
          description: Category of the integration.
        authenticationMeta:
          description: Authentication metadata.
          allOf:
          - $ref: '#/components/schemas/CustomIntegrationAuthenticationMetaDTO'
        syncModels:
          type: object
          description: Sync models configuration.
        isPublished:
          type: boolean
          description: Whether the integration is published.
        attributes:
          type: object
          description: Integration attributes.
        status:
          type: string
          description: Current status of the integration.
        customHeaders:
          type: object
          description: Custom headers for API requests.
        allowWaiting:
          type: boolean
          description: Whether the integration allows waiting.
        authType:
          type: string
        provider:
          $ref: '#/components/schemas/IntegrationProvider'
        providers:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationProvider'
        integrationCategory:
          $ref: '#/components/schemas/IntegrationCategory'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/Tool'
      required:
      - id
      - type
      - provider
      - providers
      - integrationCategory
      - actions
    GetAllToolsViewDto:
      type: object
      properties:
        tools:
          type: array
          items:
            $ref: '#/components/schemas/ToolsViewWithIntegrationConnectionStatus'
        count:
          type: number
      required:
      - tools
      - count
    ToolOptimizeRequestDTO:
      type: object
      properties:
        taskNodes:
          type: array
          items:
            $ref: '#/components/schemas/ToolOptimizeTaskNodesDTO'
        agentId:
          type: string
        autoUpdateTool:
          type: boolean
      required:
      - agentId
    IntegrationProviderRequest:
      type: object
      properties:
        endpoint:
          type: string
        method:
          type: string
        query:
          type: array
          items:
            type: string
        body:
          type: object
        bypassTLS:
          type: boolean
    User:
      type: object
      properties:
        name:
          type: string
          description: Full name of the user.
          example: John Doe
        avatarSrc:
          type: string
          description: URL to the user profile avatar image.
          example: https://example.com/avatars/user123.png
        email:
          type: string
        cognitoUserId:
          type: string
        socialProvider:
          type: string
        socialProviderId:
          type: string
        password:
          type: string
        paymentProviderCustomerId:
          type: string
        rememberToken:
          type: string
        emailVerified:
          type: boolean
        referralCode:
          type: string
        role_name:
          type: string
        isInternalUser:
          type: boolean
        id:
          type: string
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
      - name
      - email
      - cognitoUserId
      - role_name
      - isInternalUser
      - id
      - createdAt
      - updatedAt
    LinkedOutputParamRules:
      type: object
      properties:
        elementKey:
          type: string
        agentToolConfigurationInputParamsId:
          type: string
        operator:
          enum:
          - equals
          - not_equals
          - greater_than
          - less_than
          - contains
          - does_not_contain
          - starts_with
          - ends_with
          - is_empty
          - is_not_empty
          type: string
        comparisonValueType:
          enum:
          - static
          - output_param
          type: string
        comparisonValue:
          type: string
        nextRuleOperator:
          enum:
          - AND
          - OR
          type: string
        id:
          type: string
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
      - elementKey
      - agentToolConfigurationInputParamsId
      - operator
      - comparisonValueType
      - id
      - createdAt
      - updatedAt
    IntegrationProviderDetails:
      type: object
      properties:
        request:
          $ref: '#/components/schemas/IntegrationProviderRequest'
        response:
          type: object
    AgentToolConfiguration:
      type: object
      properties:
        toolFunctionName:
          type: string
          description: Function name used to invoke this tool.
          example: fetchCustomerData
        integrationProviderId:
          type: string
          description: UUID of the integration provider for this tool.
          example: provider-123e4567-e89b-12d3-a456-426614174000
        inputParams:
          description: Input parameter configurations for this tool.
          type: array
          items:
            $ref: '#/components/schemas/AgentToolConfigurationInputParams'
        outputParamsData:
          description: JSON representation of output parameters.
          type: array
          items:
            $ref: '#/components/schemas/CustomToolOutput'
        inputParamsData:
          description: JSON representation of input parameters.
          type: array
          items:
            $ref: '#/components/schemas/UserInputParamConfigDto'
        agentId:
          type: string
          description: UUID of the agent this tool configuration belongs to.
          example: agent-123e4567-e89b-12d3-a456-426614174000
        requiresConsent:
          type: boolean
          description: Whether user consent is required before executing this tool.
          example: false
        isBackgroundTool:
          type: boolean
          description: Whether this tool runs in the background without blocking workflow execution.
          example: false
        isMemoryTool:
          type: boolean
          description: Whether this tool accesses or stores data in memory.
          example: false
        isBatchExecutionEnabled:
          type: boolean
          description: Whether this tool supports batch processing of multiple items.
          example: false
        accuracyScore:
          type: number
          description: Accuracy score for this tool configuration.
          example: 0.95
        memoryLookupInstruction:
          type: string
          description: Instructions for how the tool should look up data from memory.
          example: Retrieve customer records matching the provided email address.
        preferredModel:
          type: string
          description: Preferred LLM model for this tool configuration
          example: GPT4O
        fallbackModels:
          type: string
          description: Comma-separated list of fallback models to use if preferred model fails
          example: DEEP_SEEK,BEDROCK_CLAUDE_3_7_SONNET,BEDROCK_CLAUDE_OPUS_4_5
        dynamicPropsId:
          type:
          - string
          - 'null'
          description: ID for dynamic properties configuration.
        outputParams:
          type: array
          items:
            $ref: '#/components/schemas/AgentToolConfigurationOutputParams'
        codeLanguage:
          type: string
        code:
          type: string
        originalTool:
          $ref: '#/components/schemas/ToolsViewWithIntegrationConnectionStatus'
        id:
          type: string
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
      - toolFunctionName
      - inputParams
      - agentId
      - outputParams
      - originalTool
      - id
      - createdAt
      - updatedAt
    ToolOptimizeResponseDTO:
      type: object
      properties:
        threadId:
          type: string
      required:
      - threadId
    CustomIntegrationAuthenticationMetaDTO:
      type: object
      properties:
        clientId:
          type: string
        customOAuthUrl:
          type: string
        clientSecret:
          type: string
        authorizationUrl:
          type: string
        accessTokenUrl:
          type: string
        refreshTokenUrl:
          type: string
        scopes:
          type: array
          items:
            type: string
        apiKeyType:
          type: string
          enum:
          - default
          - bearer
          - header
          - query
        grantType:
          type: string
          enum:
          - client_credentials
          - authorization_code
        parameter:
          type: string
        clientAuthentication:
          type: string
          enum:
          - headers
          - body
      required:
      - clientId
      - clientSecret
      - authorizationUrl
      - accessTokenUrl
      - refreshTokenUrl
      - scopes
      - apiKeyType
      - grantType
      - parameter
      - clientAuthentication
    CustomIntegrationToolUrlParamsDTO:
      type: object
      properties:
        key:
          type: string
        parameterHint:
          type: string
        type:
          type: string
        required:
          type: boolean
      required:
      - key
      - parameterHint
      - required
    Tool:
      type: object
      properties:
        toolFunctionName:
          type: string
          description: Function name used to invoke this tool.
        toolName:
          type: string
          description: Display name of the tool.
        iconSrc:
          type:
          - string
          - 'null'
          description: Icon source URL.
        type:
          enum:
          - beam_tool
          - gpt_tool
          - custom_gpt_tool
          - custom_integration_tool
          - code_executor_tool
          type: string
          description: Type of tool.
        isVisibleOnUi:
          type: boolean
          description: Whether this tool is visible on the UI.
        integrationId:
          type:
          - string
          - 'null'
          description: UUID of the associated integration.
        meta:
          description: Tool metadata.
          allOf:
          - $ref: '#/components/schemas/GetToolsMetaDto'
        outputId:
          type: string
          description: UUID of the output configuration.
        prompt:
          type: string
          description: Prompt template for the tool.
        inputParams:
          description: Input parameters configuration.
          type: array
          items:
            $ref: '#/components/schemas/UserInputParamConfigDto'
        requiresConsent:
          type: boolean
          description: Whether user consent is required before execution.
        isMemoryTool:
          type:
          - boolean
          - 'null'
          description: Whether this tool accesses or stores data in memory.
        isBackgroundTool:
          type: boolean
          description: Whether this tool runs in the background.
        memoryLookupInstruction:
          type:
          - string
          - 'null'
          description: Instructions for memory lookup.
        outputParams:
          description: Output parameters configuration.
          type: array
          items:
            $ref: '#/components/schemas/CustomToolOutput'
        isBatchExecutionEnabled:
          type:
          - boolean
          - 'null'
          description: Whether batch execution is enabled.
        description:
          type:
          - string
          - 'null'
          description: Description of the tool.
        isActive:
          type: boolean
          description: Whether the tool is active.
        workspaceId:
          type:
          - string
          - 'null'
          description: UUID of the workspace.
        userId:
          type:
          - string
          - 'null'
          description: UUID of the user.
        agentId:
          type:
          - string
          - 'null'
          description: UUID of the agent.
        httpMethod:
          enum:
          - post
          - get
          - delete
          - patch
          - put
          type:
          - string
          - 'null'
          description: HTTP method for custom integration tools.
        url:
          type:
          - string
          - 'null'
          description: URL for custom integration tools.
        isAvailableToWorkspace:
          type:
          - boolean
          - 'null'
          description: Whether the tool is available to the workspace.
        preferredModel:
          type: string
          description: Preferred model for the tool.
        shortDescription:
          type: string
          description: Short description of the tool.
        isSharable:
          type:
          - boolean
          - 'null'
          description: Whether the tool is sharable.
        systemIntegrationIdentifier:
          type:
          - string
          - 'null'
          description: System integration identifier.
        apiKeyType:
          type:
          - string
          - 'null'
          description: API key type.
        parameter:
          type:
          - string
          - 'null'
          description: Parameter configuration.
        allowWaiting:
          type: boolean
          description: Whether the tool allows waiting.
        queryParams:
          description: Query parameters for custom integration tools.
          type: array
          items:
            $ref: '#/components/schemas/CustomIntegrationToolQueryParamsDTO'
        bodyParams:
          description: Body parameters for custom integration tools.
          type: array
          items:
            $ref: '#/components/schemas/CustomIntegrationToolBodyParamsDTO'
        urlParams:
          description: URL parameters for custom integration tools.
          type: array
          items:
            $ref: '#/components/schemas/CustomIntegrationToolUrlParamsDTO'
        createdAt:
          format: date-time
          type: string
          description: Timestamp when the tool was created.
        updatedAt:
          format: date-time
          type: string
          description: Timestamp when the tool was last updated.
        deletedAt:
          format: date-time
          type: string
          description: Timestamp when the tool was deleted.
        toolConfigurations:
          type: array
          items:
            $ref: '#/components/schemas/AgentToolConfiguration'
        questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'
        embedding:
          type:
          - string
          - 'null'
        integration:
          $ref: '#/components/schemas/IntegrationsViewEntity'
        toolConfiguration:
          $ref: '#/components/schemas/AgentToolConfiguration'
        id:
          type: string
      required:
      - toolFunctionName
      - toolName
      - type
      - meta
      - requiresConsent
      - isBackgroundTool
      - isActive
      - createdAt
      - updatedAt
      - id
    AgentToolConfigurationInputParams:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the input parameter.
          example: param-123e4567-e89b-12d3-a456-426614174000
        paramName:
          type: string
          description: Name of the input parameter.
          example: customerId
        position:
          type: number
          description: Position/order of the parameter in the input list.
          example: 1
        fillType:
          enum:
          - ai_fill
          - static
          - user_fill
          - from_memory
          - from_task_attachment
          - linked
          type: string
          description: How the parameter value should be filled.
          example: ai_fill
        agentToolConfigurationId:
          type: string
          description: UUID of the parent tool configuration.
          example: config-123e4567-e89b-12d3-a456-426614174000
        question:
          type: string
          description: Question to ask the user when fillType is USER_FILL.
          example: What is the customer ID?
        linkParamOutputId:
          type: string
          description: ID of the linked output parameter for data flow.
        paramDescription:
          type: string
          description: Human-readable description of what this parameter represents.
          example: The unique identifier for the customer record.
        paramTip:
          type:
          - string
          - 'null'
          description: Helpful tip or hint for providing this parameter value.
          example: Enter the 8-digit customer ID from their account.
        staticValue:
          type: string
          description: Static value to use when fillType is STATIC.
          example: default_value
        required:
          type: boolean
          description: Whether this parameter is required.
          example: true
        dataType:
          type: string
          description: Data type of the parameter.
          example: string
        outputExample:
          type: string
          description: Example value demonstrating the expected input format.
          example: CUST-12345678
        reloadProps:
          type: boolean
          description: Whether to reload dynamic properties when this parameter changes.
          example: false
        remoteOptions:
          type: boolean
          description: Whether options are loaded from a remote source.
          example: false
        options:
          type:
          - array
          - 'null'
          items:
            type: object
            properties:
              label:
                type: string
              value:
                type: string
          description: Available options for selection-type parameters.
        createdAt:
          format: date-time
          type: string
          description: Timestamp when the parameter was created.
        updatedAt:
          format: date-time
          type: string
          description: Timestamp when the parameter was last updated.
        linkOutputParam:
          $ref: '#/components/schemas/AgentToolConfigurationOutputParams'
        linkedOutputParamRules:
          type: array
          items:
            $ref: '#/components/schemas/LinkedOutputParamRules'
        linkedParamRulePrompt:
          type: string
        ruleConditionConfig:
          $ref: '#/components/schemas/ParamRuleConditionConfig'
      required:
      - id
      - paramName
      - fillType
      - agentToolConfigurationId
      - createdAt
      - updatedAt
      - linkOutputParam
      - linkedOutputParamRules
    AgentCategoryInfo:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
    IntegrationCategory:
      type: object
      properties:
        title:
          type: string
          description: Title of the integration category.
        id:
          type: string
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
      - title
      - id
      - createdAt
      - updatedAt
    Question:
      type: object
      properties:
        id:
          type: string
        question:
          type: string
        keywordInPrompt:
          type: string
      required:
      - id
      - question
      - keywordInPrompt
    LinkParamsDto:
      type: object
      properties:
        toolId:
          type: string
        toolFunctionName:
          type: string
        outputParam:
          type: string
        outputId:
          type: string
    CustomIntegrationToolQueryParamsDTO:
      type: object
      properties:
        key:
          type: string
        parameterHint:
          type: string
        type:
          type: string
        required:
          type: boolean
      required:
      - key
      - parameterHint
      - required
    ToolsViewWithIntegrationConnectionStatus:
      type: object
      properties:
        toolFunctionName:
          type: string
          description: Function name used to invoke this tool.
        toolName:
          type: string
          description: Display name of the tool.
        iconSrc:
          type:
          - string
          - 'null'
          description: Icon source URL.
        type:
          enum:
          - beam_tool
          - gpt_tool
          - custom_gpt_tool
          - custom_integration_tool
          - code_executor_tool
          type: string
          description: Type of tool.
        isVisibleOnUi:
          type: boolean
          description: Whether this tool is visible on the UI.
        integrationId:
          type:
          - string
          - 'null'
          description: UUID of the associated integration.
        meta:
          description: Tool metadata.
          allOf:
          - $ref: '#/components/schemas/GetToolsMetaDto'
        outputId:
          type: string
          description: UUID of the output configuration.
        prompt:
          type: string
          description: Prompt template for the tool.
        inputParams:
          description: Input parameters configuration.
          type: array
          items:
            $ref: '#/components/schemas/UserInputParamConfigDto'
        requiresConsent:
          type: boolean
          description: Whether user consent is required before execution.
        isMemoryTool:
          type:
          - boolean
          - 'null'
          description: Whether this tool accesses or stores data in memory.
        isBackgroundTool:
          type: boolean
          description: Whether this tool runs in the background.
        memoryLookupInstruction:
          type:
          - string
          - 'null'
          description: Instructions for memory lookup.
        outputParams:
          description: Output parameters configuration.
          type: array
          items:
            $ref: '#/components/schemas/CustomToolOutput'
        isBatchExecutionEnabled:
          type:
          - boolean
          - 'null'
          description: Whether batch execution is enabled.
        description:
          type:
          - string
          - 'null'
          description: Description of the tool.
        isActive:
          type: boolean
          description: Whether the tool is active.
        workspaceId:
          type:
          - string
          - 'null'
          description: UUID of the workspace.
        userId:
          type:
          - string
          - 'null'
          description: UUID of the user.
        agentId:
          type:
          - string
          - 'null'
          description: UUID of the agent.
        httpMethod:
