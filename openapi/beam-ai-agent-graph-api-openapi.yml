openapi: 3.2.0
info:
  title: Public Agent Graph API
  description: Public endpoints to interact with agents and orchestrate tasks
  version: '1.0'
  contact: {}
servers: []
tags:
- name: Agent Graph
paths:
  /agent-graphs/add-node:
    post:
      operationId: AgentGraphController_addNode
      summary: Add Node to Graph
      description: Add a new node to an agent workflow graph. Nodes represent individual steps or actions in the agent execution flow.
      parameters:
      - name: current-workspace-id
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddNodeDto'
      responses:
        '201':
          description: Node added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MinimalAgentGraphNodeDto'
      tags:
      - Agent Graph
      security:
      - bearer: []
      - x-api-key: []
  /agent-graphs/add-edge:
    post:
      operationId: AgentGraphController_addEdge
      summary: Add Edge to Graph
      description: Add a new edge (connection) between two nodes in the agent workflow graph. Edges define the flow of execution between nodes.
      parameters:
      - name: current-workspace-id
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentGraphEdgeDto'
      responses:
        '201':
          description: Edge added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentGraphEdge'
      tags:
      - Agent Graph
      security:
      - bearer: []
      - x-api-key: []
  /agent-graphs/update-edge/{edgeId}:
    put:
      operationId: AgentGraphController_updateEdge
      summary: Update Edge in Graph
      description: Update an existing edge properties such as condition in the agent workflow graph.
      parameters:
      - name: edgeId
        required: true
        in: path
        schema:
          type: string
      - name: current-workspace-id
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEdgeDto'
      responses:
        '200':
          description: Edge updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentGraphEdge'
      tags:
      - Agent Graph
      security:
      - bearer: []
      - x-api-key: []
  /agent-graphs/test-node:
    post:
      operationId: AgentGraphController_testTool
      summary: Test Graph Node
      description: Test a specific node in the agent graph to validate its configuration and behavior.
      parameters:
      - name: current-workspace-id
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetNodeDetailsDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
      tags:
      - Agent Graph
      security:
      - bearer: []
      - x-api-key: []
  /agent-graphs/update-node:
    patch:
      operationId: AgentGraphController_updateNode
      summary: Update Graph Node
      parameters:
      - name: current-workspace-id
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNodeDto'
      responses:
        '200':
          description: Graph node updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MinimalAgentGraphNodeDto'
      tags:
      - Agent Graph
      security:
      - bearer: []
      - x-api-key: []
  /agent-graphs/{agentId}/nodes/lite:
    get:
      operationId: AgentGraphController_getAgentGraphLite
      summary: Get Agent Graph with nodes
      description: Retrieve graphs and its nodes (without configuration)
      parameters:
      - name: agentId
        required: true
        in: path
        schema:
          type: string
      - name: graphId
        required: false
        in: query
        schema:
          type: string
      - name: current-workspace-id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Agent graph nodes retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentGraphNodesResponseDto'
      tags:
      - Agent Graph
      security:
      - bearer: []
      - x-api-key: []
  /agent-graphs/{agentId}/nodes/{nodeId}:
    get:
      operationId: AgentGraphController_getNodeById
      summary: Get detailed information for a specific node
      description: Retrieves comprehensive details of a specific node within an agent graph, including its tool configuration, input/output parameters, position coordinates, and execution settings. The node must belong to a graph associated with the specified agent in the current workspace.
      parameters:
      - name: agentId
        required: true
        in: path
        schema:
          type: string
      - name: nodeId
        required: true
        in: path
        schema:
          type: string
      - name: current-workspace-id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Node details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentGraphNode'
      tags:
      - Agent Graph
      security:
      - bearer: []
      - x-api-key: []
  /agent-graphs/{agentId}/nodes/{nodeId}/input-output-params:
    patch:
      operationId: AgentGraphController_updateNodeParams
      summary: Update input/output parameters for a node tool configuration
      description: Updates the input and/or output parameters of a tool configuration associated with a specific node in the agent graph. Input parameters define how data flows into the tool (e.g., AI-filled, user-provided, static values, or linked from other node outputs). Output parameters define the data structure returned by the tool. Only the parameters provided in the request body will be updated; omitted parameters remain unchanged.
      parameters:
      - name: agentId
        required: true
        in: path
        schema:
          type: string
      - name: nodeId
        required: true
        in: path
        schema:
          type: string
      - name: current-workspace-id
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInputOutputParamsDto'
      responses:
        '200':
          description: Parameters updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentGraphNode'
      tags:
      - Agent Graph
      security:
      - bearer: []
      - x-api-key: []
  /agent-graphs/{agentId}/nodes/{nodeId}/prompt:
    patch:
      operationId: AgentGraphController_updateNodePrompt
      summary: Update prompt of the tool
      description: Update prompt of the tool used in the node
      parameters:
      - name: agentId
        required: true
        in: path
        schema:
          type: string
      - name: nodeId
        required: true
        in: path
        schema:
          type: string
      - name: current-workspace-id
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNodePromptDto'
      responses:
        '200':
          description: Prompt Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentGraphNode'
      tags:
      - Agent Graph
      security:
      - bearer: []
      - x-api-key: []
  /agent-graphs/{agentId}:
    get:
      operationId: AgentGraphController_getAgentGraph
      summary: Get Agent Graph
      description: Retrieve the workflow graph configuration for a specific agent.
      parameters:
      - name: agentId
        required: true
        in: path
        schema:
          type: string
      - name: graphId
        required: false
        in: query
        schema:
          type: string
      - name: current-workspace-id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Agent graph retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptimizedAgentGraphResponseDto'
      tags:
      - Agent Graph
      security:
      - bearer: []
      - x-api-key: []
  /agent-graphs/agent-task-nodes/{toolFunctionName}:
    get:
      operationId: AgentGraphController_getTaskNodesByToolFunctionName
      summary: Get Task Nodes by Tool
      description: Retrieve task nodes that use a specific tool function for analysis and optimization.
      parameters:
      - name: toolFunctionName
        required: true
        in: path
        schema:
          type: string
      - name: pageNum
        required: false
        in: query
        schema:
          minimum: 1
          type: number
      - name: pageSize
        required: false
        in: query
        schema:
          minimum: 1
          maximum: 100
          type: number
      - name: agentId
        required: true
        in: query
        schema:
          type: string
      - name: isRated
        required: true
        in: query
        schema:
          type: boolean
      - name: current-workspace-id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Task nodes retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPaginatedAgentTaskNodeDto'
      tags:
      - Agent Graph
      security:
      - bearer: []
      - x-api-key: []
  /agent-graphs/{graphId}/publish:
    patch:
      operationId: AgentGraphController_publishGraph
      parameters:
      - name: graphId
        required: true
        in: path
        schema:
          type: string
      - name: current-workspace-id
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptimizedAgentGraphResponseDto'
      tags:
      - Agent Graph
      security:
      - bearer: []
      - x-api-key: []
      summary: Agent graph controller publish graph
      x-summary-source: derived
components:
  schemas:
    CustomIntegrationToolBodyParamsDTO:
      type: object
      properties:
        key:
          type: string
        parameterHint:
          type: string
        type:
          type: string
        required:
          type: boolean
      required:
      - key
      - parameterHint
      - type
      - required
    AgentTaskNode:
      type: object
      properties:
        userQuestions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TaskStepUserInput'
        edgeEvaluations:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/EdgeEvaluationDto'
        input:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TaskNodeInput'
        output:
          allOf:
          - $ref: '#/components/schemas/TaskNodeOutput'
        nodeEvaluation:
          type: array
          items:
            required: true
            type:
            - array
            - 'null'
            items:
              $ref: '#/components/schemas/NodeEvaluation'
        agentTaskId:
          type: string
        agentGraphNodeId:
          type: string
        status:
          enum:
          - QUEUED
          - IN_PROGRESS
          - USER_INPUT_REQUIRED
          - COMPLETED
          - USER_CONSENT_REQUIRED
          - FAILED
          - INSUFFICIENT_CREDITS
          - WAITING
          type: string
        userConsent:
          type: boolean
        isEverConsentRequired:
          type: boolean
        retriedCountWhenFailure:
          type: number
        retriedCountWhenAccuracyIsLow:
          type: number
        manualRetryCount:
          type: number
        evaluationScore:
          type:
          - number
          - 'null'
        toolData:
          allOf:
          - $ref: '#/components/schemas/ToolDataDto'
        userFeedback:
          type: string
        expectedOutput:
          type: string
        rating:
          enum:
          - positive
          - negative
          type: string
        waitSyncCreated:
          type: boolean
        agentTask:
          $ref: '#/components/schemas/AgentTask'
        agentGraphNode:
          $ref: '#/components/schemas/AgentGraphNode'
        id:
          type: string
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
      - userQuestions
      - edgeEvaluations
      - input
      - output
      - nodeEvaluation
      - agentTaskId
      - agentGraphNodeId
      - status
      - userConsent
      - isEverConsentRequired
      - retriedCountWhenFailure
      - retriedCountWhenAccuracyIsLow
      - manualRetryCount
      - evaluationScore
      - toolData
      - waitSyncCreated
      - agentTask
      - agentGraphNode
      - id
      - createdAt
      - updatedAt
    TaskStepUserInput:
      type: object
      properties:
        question:
          type: string
        answer:
          type: string
        parameter:
          type: string
        memoryAnswer:
          type: boolean
        foodForThought:
          type: array
          items:
            $ref: '#/components/schemas/FoodForThought'
      required:
      - question
      - answer
    CreateConditionGroupDto:
      type: object
      properties:
        nextGroupOperator:
          enum:
          - AND
          - OR
          type:
          - string
          - 'null'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/CreateConditionRuleDto'
      required:
      - rules
    LinkedOutputParamRuleDto:
      type: object
      properties:
        elementKey:
          type: string
          description: Element key for the rule.
        operator:
          enum:
          - equals
          - not_equals
          - greater_than
          - less_than
          - contains
          - does_not_contain
          - starts_with
          - ends_with
          - is_empty
          - is_not_empty
          type: string
          description: Comparison operator for the rule.
        comparisonValueType:
          enum:
          - static
          - output_param
          type: string
          description: Type of the comparison value.
        comparisonValue:
          type:
          - string
          - 'null'
          description: Value to compare against.
        nextRuleOperator:
          enum:
          - AND
          - OR
          type: string
          description: Logical operator linking to the next rule.
      required:
      - elementKey
      - operator
      - comparisonValueType
    AgentGraphNode:
      type: object
      properties:
        evaluationCriteria:
          type: array
          items:
            type: string
        agentToolConfigurationId:
          type: string
        toolConfiguration:
          $ref: '#/components/schemas/AgentToolConfiguration'
        objective:
          type: string
        customId:
          type: string
        isExitNode:
          type: boolean
        isEntryNode:
          type: boolean
        agentGraphId:
          type: string
        xCoordinate:
          type: number
        yCoordinate:
          type: number
        onError:
          enum:
          - CONTINUE
          - STOP
          type: string
        isEvaluationEnabled:
          type: boolean
        autoRetryWhenAccuracyLessThan:
          type: number
        autoRetryLimitWhenAccuracyIsLow:
          type: number
        enableAutoRetryWhenAccuracyIsLow:
          type: boolean
        enableAutoRetryWhenFailure:
          type: boolean
        autoRetryCountWhenFailure:
          type: number
        autoRetryWaitTimeWhenFailureInMs:
          type: number
        isAttachmentDataPulledIn:
          type: boolean
        nodeType:
          enum:
          - executionNode
          - conditionNode
          - waitingNode
          - entryNode
          - exitNode
          type: string
        nodeConfigurations:
          $ref: '#/components/schemas/NodeConfigurations'
        saveAsVersion:
          type: boolean
        isEdited:
          type: boolean
        isActiveNodeVersion:
          type: boolean
        userId:
          type: string
        autoRetryDescription:
          type: string
        enableAutoRetryDescription:
          type: boolean
        id:
          type: string
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
      - evaluationCriteria
      - toolConfiguration
      - objective
      - customId
      - isExitNode
      - isEntryNode
      - agentGraphId
      - onError
      - isEvaluationEnabled
      - autoRetryWhenAccuracyLessThan
      - autoRetryLimitWhenAccuracyIsLow
      - enableAutoRetryWhenAccuracyIsLow
      - enableAutoRetryWhenFailure
      - autoRetryCountWhenFailure
      - autoRetryWaitTimeWhenFailureInMs
      - isAttachmentDataPulledIn
      - nodeType
      - saveAsVersion
      - isEdited
      - isActiveNodeVersion
      - autoRetryDescription
      - enableAutoRetryDescription
      - id
      - createdAt
      - updatedAt
    IntegrationCategory:
      type: object
      properties:
        title:
          type: string
          description: Title of the integration category.
        id:
          type: string
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
      - title
      - id
      - createdAt
      - updatedAt
    Tool:
      type: object
      properties:
        toolFunctionName:
          type: string
          description: Function name used to invoke this tool.
        toolName:
          type: string
          description: Display name of the tool.
        iconSrc:
          type:
          - string
          - 'null'
          description: Icon source URL.
        type:
          enum:
          - beam_tool
          - gpt_tool
          - custom_gpt_tool
          - custom_integration_tool
          - code_executor_tool
          type: string
          description: Type of tool.
        isVisibleOnUi:
          type: boolean
          description: Whether this tool is visible on the UI.
        integrationId:
          type:
          - string
          - 'null'
          description: UUID of the associated integration.
        meta:
          description: Tool metadata.
          allOf:
          - $ref: '#/components/schemas/GetToolsMetaDto'
        outputId:
          type: string
          description: UUID of the output configuration.
        prompt:
          type: string
          description: Prompt template for the tool.
        inputParams:
          description: Input parameters configuration.
          type: array
          items:
            $ref: '#/components/schemas/UserInputParamConfigDto'
        requiresConsent:
          type: boolean
          description: Whether user consent is required before execution.
        isMemoryTool:
          type:
          - boolean
          - 'null'
          description: Whether this tool accesses or stores data in memory.
        isBackgroundTool:
          type: boolean
          description: Whether this tool runs in the background.
        memoryLookupInstruction:
          type:
          - string
          - 'null'
          description: Instructions for memory lookup.
        outputParams:
          description: Output parameters configuration.
          type: array
          items:
            $ref: '#/components/schemas/CustomToolOutput'
        isBatchExecutionEnabled:
          type:
          - boolean
          - 'null'
          description: Whether batch execution is enabled.
        description:
          type:
          - string
          - 'null'
          description: Description of the tool.
        isActive:
          type: boolean
          description: Whether the tool is active.
        workspaceId:
          type:
          - string
          - 'null'
          description: UUID of the workspace.
        userId:
          type:
          - string
          - 'null'
          description: UUID of the user.
        agentId:
          type:
          - string
          - 'null'
          description: UUID of the agent.
        httpMethod:
          enum:
          - post
          - get
          - delete
          - patch
          - put
          type:
          - string
          - 'null'
          description: HTTP method for custom integration tools.
        url:
          type:
          - string
          - 'null'
          description: URL for custom integration tools.
        isAvailableToWorkspace:
          type:
          - boolean
          - 'null'
          description: Whether the tool is available to the workspace.
        preferredModel:
          type: string
          description: Preferred model for the tool.
        shortDescription:
          type: string
          description: Short description of the tool.
        isSharable:
          type:
          - boolean
          - 'null'
          description: Whether the tool is sharable.
        systemIntegrationIdentifier:
          type:
          - string
          - 'null'
          description: System integration identifier.
        apiKeyType:
          type:
          - string
          - 'null'
          description: API key type.
        parameter:
          type:
          - string
          - 'null'
          description: Parameter configuration.
        allowWaiting:
          type: boolean
          description: Whether the tool allows waiting.
        queryParams:
          description: Query parameters for custom integration tools.
          type: array
          items:
            $ref: '#/components/schemas/CustomIntegrationToolQueryParamsDTO'
        bodyParams:
          description: Body parameters for custom integration tools.
          type: array
          items:
            $ref: '#/components/schemas/CustomIntegrationToolBodyParamsDTO'
        urlParams:
          description: URL parameters for custom integration tools.
          type: array
          items:
            $ref: '#/components/schemas/CustomIntegrationToolUrlParamsDTO'
        createdAt:
          format: date-time
          type: string
          description: Timestamp when the tool was created.
        updatedAt:
          format: date-time
          type: string
          description: Timestamp when the tool was last updated.
        deletedAt:
          format: date-time
          type: string
          description: Timestamp when the tool was deleted.
        toolConfigurations:
          type: array
          items:
            $ref: '#/components/schemas/AgentToolConfiguration'
        questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'
        embedding:
          type:
          - string
          - 'null'
        integration:
          $ref: '#/components/schemas/IntegrationsViewEntity'
        toolConfiguration:
          $ref: '#/components/schemas/AgentToolConfiguration'
        id:
          type: string
      required:
      - toolFunctionName
      - toolName
      - type
      - meta
      - requiresConsent
      - isBackgroundTool
      - isActive
      - createdAt
      - updatedAt
      - id
    GetNodeDetailsDto:
      type: object
      properties:
        agentId:
          type: string
        nodeId:
          type: string
        graphId:
          type: string
        params:
          type: object
      required:
      - agentId
      - nodeId
      - graphId
    AgentTriggerConfigurationFiltersGroup:
      type: object
      properties:
        operator:
          enum:
          - AND
          - OR
          type: string
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/AgentTriggerConfigurationFiltersConditions'
      required:
      - operator
      - conditions
    AgentGraphEdge:
      type: object
      properties:
        sourceAgentGraphNodeId:
          type: string
        targetAgentGraphNodeId:
          type: string
        condition:
          type: string
        isAttachmentDataPulledIn:
          type: boolean
        conditionGroups:
          type: array
          items:
            $ref: '#/components/schemas/AgentGraphEdgeConditionGroup'
        id:
          type: string
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
      - sourceAgentGraphNodeId
      - targetAgentGraphNodeId
      - isAttachmentDataPulledIn
      - conditionGroups
      - id
      - createdAt
      - updatedAt
    IntegrationProviderRequest:
      type: object
      properties:
        endpoint:
          type: string
        method:
          type: string
        query:
          type: array
          items:
            type: string
        body:
          type: object
        bypassTLS:
          type: boolean
    OptimizedAgentGraphDto:
      type: object
      properties:
        id:
          type: string
        agentId:
          type: string
        isActive:
          type: boolean
        isDraft:
          type: boolean
        isPublished:
          type: boolean
        isEdited:
          type: boolean
        publishedAt:
          type: object
        isEverExecuted:
          type: boolean
        isEverUsedForTemplate:
          type: boolean
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/MinimalAgentGraphNodeDto'
        agent:
          $ref: '#/components/schemas/MinimalAgentDto'
      required:
      - id
      - agentId
      - isActive
      - isDraft
      - isPublished
      - isEdited
      - isEverExecuted
      - isEverUsedForTemplate
      - nodes
      - agent
    TaskNodeInput:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        value:
          type: string
        answer:
          type: string
        question:
          type:
          - string
          - 'null'
        reasoning:
          type:
          - string
          - 'null'
        found:
          type: boolean
        required:
          type: boolean
      required:
      - id
      - name
      - value
      - question
      - reasoning
      - found
      - required
    UpdateConditionRuleDto:
      type: object
      properties:
        id:
          type: string
        sourceAgentToolConfigurationOutputParamsId:
          type: string
        operator:
          enum:
          - equals
          - not_equals
          - greater_than
          - less_than
          - contains
          - does_not_contain
          - starts_with
          - ends_with
          - is_empty
          - is_not_empty
          type: string
        comparisonValueType:
          enum:
